[package]
name = "vellum"
version = "0.2.0"
authors = ["greyxp1 <greyxp999@gmail.com>"]
edition = "2024"
description = "Live screen annotation overlay for Wayland"
repository = "https://github.com/greyxp1/vellum"
license = "MIT"
keywords = ["wayland", "annotation"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
toml = "0.9"

clap = { version = "4.6.6", features = ["derive"]}
clap_derive = "4.6.4"

wayland-client = "0.31.11"
# layer shell
wayland-protocols-wlr = { version = "0.3.9", features = ["client"] }
# cursor shape
wayland-protocols = { version = "0.32.9", features = [
    "client",
    "staging",
    "unstable",
] }
# Enables the raw Wayland handles required to create the WGPU surface.
wayland-backend = { version = "0.3.11", features = ["client_system"] }

wgpu = { version = "28.0.0", default-features = false, features = [
    "std",
    "parking_lot",
    "gles",
    "vulkan",
    "wgsl",
] }
pollster = "0.4.0"
glyphon = "0.10.0"
unicode-segmentation = "1.13.3"
xkbcommon = "0.9.0"
rustix = { version = "1.1.2", features = ["event"] }

lyon_tessellation = "1.0.16"
perfect_freehand = "0.1.1"
bytemuck = "1.24.0"
